<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>O Maskara</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header class="top">
      <div class="brand">
        <div class="logo">
          <img src="icons/icon48.png" alt="O Maskara" />
        </div>
        <div>
          <div class="title">O Maskara</div>
          <div class="sub">
  <span id="userEmail">—</span>
  <span id="authOk" hidden>✅</span>
</div>
        </div>
      </div>

      <div class="top-actions">
        <button id="btnRefresh" class="iconbtn" type="button" aria-label="Atualizar">⟳</button>
      </div>
    </header>

<section id="stepperWrap">
  <section class="stepTop" aria-label="Etapas">
  <div class="stepChip stepOn" data-step="1">
    <span class="n">1</span><span class="t">PLANO</span>
  </div>
  <div class="sep">›</div>
  <div class="stepChip" data-step="2">
    <span class="n">2</span><span class="t">KIT + SCRIPT</span>
  </div>
</section>

</section>


    <!-- LOGIN GATE -->
    <section id="loginGate" class="card" hidden>
      <div class="label">Login</div>
      <div class="hint" style="margin:6px 0 10px">
        Faça login para carregar planos e kits.
      </div>
      <div class="actions" style="margin-top:0">
        <button id="btnGoogleLogin" class="primary" type="button">🔐 Fazer login</button>
      </div>
    </section>

    <!-- APP -->
    <section id="appGate" class="gate">

      <!-- PAGE 1 -->
      <section id="pageList" class="page">
        <section class="search">
          <input id="q" type="search" placeholder="Buscar plano..." autocomplete="off" />
        </section>
        <section class="list" id="plansList"></section>
      </section>

      <!-- PAGE 2 -->
      <section id="pageDetails" class="page" hidden>
        <div class="row">
          <span class="pill" id="planPill">Plano</span>
          <button id="btnBack" class="ghost small" type="button">← Voltar</button>
        </div>

        <div class="card">
          <div class="label">Portal</div>
          <div class="mono" id="planUrl">—</div>
        </div>

        <div class="card">
          <div class="label">Kit de procedimentos</div>
          <div class="hint" id="kitHint" style="margin-top:0; margin-bottom:8px;">Selecione um kit</div>

          <div class="row2">
  <div id="kitDD" class="dd" aria-label="Selecionar kit">
    <button id="kitDDBtn" class="ddBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span id="kitDDLabel">— Escolha um kit —</span>
      <span class="ddChevron">▾</span>
    </button>

    <div id="kitDDMenu" class="ddMenu" role="listbox" tabindex="-1" hidden>
      <div class="ddSearchWrap">
        <input id="kitDDSearch" class="ddSearch" type="search" placeholder="Buscar kit..." autocomplete="off">
      </div>
      <div id="kitDDList" class="ddList"></div>
    </div>
  </div>
</div>


          <div class="helper mono" id="codesInfo" style="margin-top:10px;">Códigos: —</div>
        </div>

        <div class="actions">
          <button id="btnOpen" class="ghost" type="button">🌐 Abrir portal</button>
          <button id="btnRun" class="primary maskara" type="button">🎭 Executar Kit</button>
        </div>

        <div class="card">
          <div class="label">Logs</div>
          <textarea id="logBox" readonly spellcheck="false"></textarea>
        </div>
      </section>

    </section><!-- ✅ fecha appGate -->
<div class="footerNote">Desenvolvido by <strong>Will</strong></div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
